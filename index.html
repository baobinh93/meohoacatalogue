<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meo Hoa Boutique</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">MÈO HOA</h1>
        <p class="subtitle">Catalog sản phẩm</p>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <input id="searchInput" type="text" placeholder="Tìm sản phẩm..." />
        <div class="sort-buttons">
          <button id="sortLowBtn" type="button" class="flex">
            <span class="">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5 7H9"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M5 12H12"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M5 17H14"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M14.5 9.5L17 7L19.5 9.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M17 7V17"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </span>
            <span class="laptop-only"> Giá Thấp → Cao </span>
          </button>

          <button id="sortHighBtn" type="button" class="flex">
            <span>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5 17H9"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M5 12H12"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M5 7H14"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M14.5 14.5L17 17L19.5 14.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M17 17V7"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </span>
            <span class="laptop-only"> Giá cao → thấp</span>
          </button>
        </div>
        <button id="refreshBtn" class="refreshBtn">
          <span>↻</span>
          <span class="laptop-only"> Làm mới </span>
        </button>
      </section>

      <div id="status" class="status">Đang tải sản phẩm...</div>
      <section id="productGrid" class="product-grid"></section>
    </main>

    <div
      id="productModal"
      class="modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-content">
        <button
          id="modalClose"
          class="modal-close"
          type="button"
          aria-label="Đóng"
        >
          ×
        </button>
        <div class="modal-image-wrap">
          <img id="modalImage" class="modal-image" src="" alt="" />
        </div>
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalPrice" class="modal-price"></div>
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
