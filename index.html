<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog sản phẩm</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">MÈO HOA</h1>
      <p class="subtitle">Catalog sản phẩm</p>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="searchInput" type="text" placeholder="Tìm sản phẩm..." />
      <button id="refreshBtn">↻ Làm mới</button>
    </section>

    <div id="status" class="status">Đang tải sản phẩm...</div>
    <section id="productGrid" class="product-grid"></section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
